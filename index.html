<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة المهام التفاعلية - To-Do List</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                
                <!-- Card Container -->
                <div class="card main-card shadow-lg border-0 rounded-4">
                    
                    <!-- Header -->
                    <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center p-4 pb-0">
                        <h2 class="fw-bold mb-0 gradient-text" id="app-title">
                            <i class="fa-solid fa-list-check me-2"></i> قائمة المهام
                        </h2>
                        
                        <!-- Actions Controls (Theme & Lang) -->
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-custom rounded-circle p-2" id="lang-btn" title="تغيير اللغة">
                                <i class="fa-solid fa-globe"></i> <span id="lang-text" class="fw-bold">EN</span>
                            </button>
                            <button class="btn btn-outline-custom rounded-circle p-2" id="theme-btn" title="تغيير الثيم">
                                <i class="fa-solid fa-moon" id="theme-icon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Body -->
                    <div class="card-body p-4">
                        
                        <!-- Input Form -->
                        <form id="todo-form" class="row g-2 mb-4">
                            <div class="col-12 col-sm-6">
                                <input type="text" id="todo-input" class="form-control form-control-lg rounded-3" placeholder="أضف مهمة جديدة..." required>
                            </div>
                            <div class="col-6 col-sm-3">
                                <select id="priority-select" class="form-select form-select-lg rounded-3 fw-semibold">
                            <option value="low" id="opt-low">🔵 منخفضة</option>
                            <option value="medium" selected id="opt-med">🟠 متوسطة</option>
                            <option value="high" id="opt-high">🔴 عالية</option>
                                </select>
                            </div>
                            <div class="col-6 col-sm-3">
                                <button type="submit" class="btn btn-gradient btn-lg w-100 rounded-3 text-white fw-bold" id="add-btn">
                                    <i class="fa-solid fa-plus me-1"></i> إضافة
                                </button>
                            </div>
                        </form>

                        <!-- Filters & Stats -->
                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3 p-2 bg-body-tertiary rounded-3">
                            <div class="btn-group w-100-mobile" role="group">
                                <button type="button" class="btn btn-sm btn-filter active" data-filter="all" id="filter-all">الكل</button>
                                <button type="button" class="btn btn-sm btn-filter" data-filter="active" id="filter-active">النشطة</button>
                                <button type="button" class="btn btn-sm btn-filter" data-filter="completed" id="filter-completed">المكتملة</button>
                            </div>
                            <div class="text-muted small fw-semibold" id="task-counter">
                                المهام المتبقية: <span id="pending-count" class="badge bg-primary rounded-pill">0</span>
                            </div>
                        </div>

                        <!-- Task List -->
                        <ul class="list-group list-group-flush gap-2" id="todo-list">
                            <!-- المهام ستُضاف هنا ديناميكياً بواسطة JavaScript -->
                        </ul>

                        <!-- Empty State -->
                        <div id="empty-state" class="text-center py-5 d-none">
                            <i class="fa-regular fa-clipboard fa-3x text-muted mb-3 opacity-50"></i>
                            <p class="text-muted fw-bold mb-0" id="empty-msg">لا توجد مهام حالياً!</p>
                        </div>

                    </div>

                    <!-- Footer -->
                    <div class="card-footer bg-transparent border-0 text-center pb-4">
                        <button id="clear-all" class="btn btn-sm btn-outline-danger rounded-pill px-3">
                            <i class="fa-solid fa-trash me-1"></i> <span id="clear-text">مسح الكل</span>
                        </button>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="./js/style.js"></script>
</body>
</html>
